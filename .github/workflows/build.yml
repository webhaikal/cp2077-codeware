name: Build

# Build check only: compiles the Windows target with upstream's xmake setup, so a macOS port branch can prove
# that the shared code still builds for Windows. Not part of any pull request.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # CI-only: TiltedCore's prebuilt package expects mimalloc 2 (mi_malloc_size); xmake-repo now resolves mimalloc 3.5.3,
      # which fails the link for upstream as well. Pin mimalloc 2 for this check only; xmake.lua in the repository is unchanged.
      - name: Pin mimalloc 2 for TiltedCore (CI only)
        shell: bash
        run: |
          sed -i '/^add_requires(/a add_requireconfs("tiltedcore.mimalloc", {override = true, version = "2.1.7"})' xmake.lua
          grep -n "add_require" xmake.lua
      - name: Configure (release)
        run: xmake f -m release -y

      - name: Build
        run: xmake -y -v

      - name: Package mod
        shell: pwsh
        run: |
          $TargetFile = xmake show -t Codeware --targetdir
          $ReleaseBinPath = Join-Path $TargetFile "Codeware.dll"
          
          # If the file isn't directly in targetdir, check standard build outputs:
          if (-not (Test-Path $ReleaseBinPath)) {
              $ReleaseBinPath = "build/windows/x64/release/Codeware.dll"
          }
          
          Write-Output "Packaging using binary from: $ReleaseBinPath"
          ./tools/dist/package-mod.ps1 -ReleaseBin $ReleaseBinPath

      - name: Create GitHub Release and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Dynamically extract version via your repository script to match the tag name
          $Version = & ./tools/dist/steps/get-version.ps1
          $TagName = "v$Version"

          # Check if the release already exists to avoid conflicts on re-runs
          $ReleaseExists = gh release view $TagName 2>$null
          
          if (-not $ReleaseExists) {
              # Creates the release using both the mod and the pdb zip files from build/dist
              gh release create $TagName build/dist/*.zip `
                --title "Release $TagName" `
                --notes "Automated build release for version $Version"
          } else {
              # If you are testing and the release already exists, upload/overwrite the assets instead
              gh release upload $TagName build/dist/*.zip --clobber
          }
